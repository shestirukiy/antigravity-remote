name: Build Antigravity Remote APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Enable Cleartext HTTP Traffic in AndroidManifest
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk AntigravityRemote.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityRemote-APK
          path: AntigravityRemote.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Antigravity Remote (Android APK v2.5)"
          body: |
            ### 📱 Antigravity Mobile Remote v2.5
            - **Отображение проектов** идентично Antigravity (с аккордеоном по проектам).
            - **Полноэкранный автономный режим** (без браузера, без вкладок).
            - **Голосовой ввод и быстрые действия** (Proceed, Статус, Продолжай).
            - **Прямое скачивание**: [AntigravityRemote.apk](https://github.com/shestirukiy/antigravity-remote/releases/download/latest/AntigravityRemote.apk)
          files: AntigravityRemote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
