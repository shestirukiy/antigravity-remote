<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#181818">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Antigravity Remote</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface: #181818;
            --surface-hover: #222222;
            --surface-card: #1e1e1e;
            --primary: #58a6ff;
            --text-main: #e6e6e6;
            --text-muted: #888888;
            --text-dim: #5c5c5c;
            --user-bubble: #1f6feb;
            --bot-bubble: #1e1e1e;
            --accent-green-bright: #3fb950;
            --accent-red: #da3633;
            --border: #2a2a2a;
            --sidebar-bg: #181818;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Шапка */
        header {
            background-color: var(--surface);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }
        .btn-menu {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.45rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .header-title-container {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-project-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: #8da4be;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-title {
            font-weight: 600;
            font-size: 0.98rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green-bright);
            box-shadow: 0 0 8px var(--accent-green-bright);
        }

        /* Чат */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 145px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 92%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 1.05rem;
        }
        .msg.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background-color: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }
        .msg-role {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        /* Нижняя панель */
        .fixed-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--surface);
            border-top: 1px solid var(--border);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid #202020;
        }
        .action-chip {
            background-color: var(--surface-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        .action-chip.proceed {
            background-color: #1b4728;
            border-color: var(--accent-green-bright);
            color: #7ee787;
        }
        .input-bar {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 22px;
            resize: none;
            max-height: 100px;
            min-height: 48px;
            font-size: 1.05rem;
            line-height: 1.35;
            outline: none;
            font-family: inherit;
        }
        textarea:focus { border-color: #404040; }
        .btn-round {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background-color: #2b6cb0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 1.25rem;
            transition: transform 0.15s;
        }
        .btn-round:active { transform: scale(0.92); }
        .btn-voice {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.3rem;
        }
        .btn-voice.recording {
            background-color: var(--accent-red);
            color: white;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        /* ТОЧНАЯ КОПИЯ БОКОВОЙ ПАНЕЛИ ANTIGRAVITY */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 88%;
            max-width: 360px;
            background-color: var(--sidebar-bg);
            z-index: 210;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .drawer.open { transform: translateX(0); }

        .sidebar-top {
            padding: 14px 14px 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }
        .btn-new-convo {
            background-color: #242424;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .btn-new-convo:active { background-color: #2d2d2d; }

        .sidebar-nav-item {
            padding: 8px 10px;
            color: #b0b0b0;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 6px;
        }
        .sidebar-nav-item:hover { background-color: rgba(255, 255, 255, 0.04); }

        /* Заголовок Projects */
        .projects-header-row {
            padding: 12px 14px 6px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .projects-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Проект в стиле Antigravity */
        .project-item {
            display: flex;
            flex-direction: column;
        }
        .project-row {
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #d1d1d1;
            font-size: 0.94rem;
            user-select: none;
        }
        .project-row:hover, .project-row:active {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .project-folder-icon {
            color: #8c8c8c;
            font-size: 1rem;
            display: flex;
            align-items: center;
        }
        .project-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        /* Список диалогов внутри проекта */
        .convs-sublist {
            display: none;
            flex-direction: column;
            padding-left: 24px;
            gap: 1px;
            margin-top: 2px;
            margin-bottom: 4px;
        }
        .convs-sublist.open {
            display: flex;
        }

        .conv-subitem {
            padding: 7px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            color: #adadad;
            font-size: 0.88rem;
        }
        .conv-subitem:hover, .conv-subitem:active {
            background-color: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }
        .conv-subitem.active {
            background-color: rgba(88, 166, 255, 0.14);
            color: #ffffff;
            font-weight: 500;
        }
        .conv-subitem-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-subitem-time {
            color: var(--text-dim);
            font-size: 0.78rem;
            flex-shrink: 0;
        }
        .conv-subitem.active .conv-subitem-time {
            color: #58a6ff;
        }

        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="header-left">
            <button class="btn-menu" onclick="toggleDrawer()" title="Меню Antigravity">☰</button>
            <div class="header-title-container">
                <div class="header-project-badge" id="headerProject">📁 Projects</div>
                <div class="header-title" id="headerTitle">Antigravity Remote</div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-dot"></div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">Wi-Fi</div>
        </div>
    </header>

    <!-- Сообщения чата -->
    <div class="chat-container" id="chat">
        <div class="msg assistant">
            <div class="msg-role">Система</div>
            Подключено к Antigravity на ПК. Выберите проект и диалог в боковом меню ☰ или отправьте команду.
        </div>
    </div>

    <!-- Фиксированный низ -->
    <div class="fixed-bottom">
        <div class="quick-actions">
            <button class="action-chip proceed" onclick="sendAction('proceed')">✓ Одобрить (Proceed)</button>
            <button class="action-chip" onclick="quickSend('Покажи текущий статус задачи')">Статус задачи</button>
            <button class="action-chip" onclick="quickSend('Продолжай')">Продолжай</button>
            <button class="action-chip" onclick="sendAction('escape')">❌ Отмена</button>
        </div>
        <div class="input-bar">
            <button class="btn-round btn-voice" id="micBtn" onclick="toggleVoice()" title="Голосовой ввод">🎤</button>
            <textarea id="promptInput" rows="1" placeholder="Инструкция для Antigravity..." oninput="autoGrow(this)" onkeydown="checkEnter(event)"></textarea>
            <button class="btn-round" onclick="sendPrompt()" title="Отправить">➤</button>
        </div>
    </div>

    <!-- Боковое меню (ТОЧНАЯ КОПИЯ ANTIGRAVITY) -->
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="sidebar-top">
            <button class="btn-new-convo" onclick="quickSend('/new')">
                <span style="font-size: 1.1rem; line-height: 1;">+</span>
                <span>New Conversation</span>
            </button>
            <div class="sidebar-nav-item" onclick="toggleDrawer()">
                <span>🕒</span>
                <span>Conversation History</span>
            </div>
            <div class="sidebar-nav-item" onclick="quickSend('/automations')">
                <span>⏱️</span>
                <span>Automations</span>
            </div>
            <div class="sidebar-nav-item" onclick="quickSend('/customizations')">
                <span>🖨️</span>
                <span>Customizations</span>
            </div>
        </div>

        <div class="projects-header-row">
            <span>Projects</span>
            <span style="font-size: 1rem; opacity: 0.7;">📁</span>
        </div>

        <div class="projects-scroll" id="projectsList">
            <div style="padding: 16px; color: var(--text-muted); text-align: center;">Загрузка проектов...</div>
        </div>

        <div class="sidebar-footer" onclick="toggleDrawer()">
            <span>⚙️</span>
            <span>Settings</span>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes('capacitor://') || (window.location.origin.includes('localhost') && !window.location.port)
            ? 'http://192.168.0.106:8080'
            : '';

        let lastMsgCount = 0;
        let isRecording = false;
        let recognition = null;
        let activeConvId = null;
        let openProjects = new Set();

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        function checkEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            const isOpen = drawer.classList.contains('open');
            if (isOpen) {
                drawer.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                loadProjects();
                drawer.classList.add('open');
                overlay.classList.add('open');
            }
        }

        async function loadProjects() {
            try {
                const res = await fetch(API_BASE + '/api/projects');
                if (!res.ok) return;
                const data = await res.json();
                activeConvId = data.active_id;

                const list = document.getElementById('projectsList');
                list.innerHTML = '';

                data.projects.forEach((proj, idx) => {
                    const item = document.createElement('div');
                    item.className = 'project-item';

                    // Если содержит активный диалог или был открыт ранее, открываем
                    const hasActive = proj.conversations.some(c => c.id === activeConvId);
                    if (hasActive || (openProjects.size === 0 && idx === 0)) {
                        openProjects.add(proj.name);
                    }
                    const isOpen = openProjects.has(proj.name);

                    const row = document.createElement('div');
                    row.className = 'project-row';
                    row.onclick = () => toggleProject(proj.name);
                    row.innerHTML = `
                        <span class="project-folder-icon">📁</span>
                        <span class="project-title">${escapeHtml(proj.name)}</span>
                    `;

                    const sublist = document.createElement('div');
                    sublist.className = 'convs-sublist' + (isOpen ? ' open' : '');

                    proj.conversations.forEach(c => {
                        const convRow = document.createElement('div');
                        convRow.className = 'conv-subitem' + (c.id === activeConvId ? ' active' : '');
                        convRow.onclick = (e) => {
                            e.stopPropagation();
                            switchConversation(c.id, c.title, proj.name);
                        };
                        convRow.innerHTML = `
                            <span class="conv-subitem-title">${escapeHtml(c.title)}</span>
                            <span class="conv-subitem-time">${c.time}</span>
                        `;
                        sublist.appendChild(convRow);
                    });

                    item.appendChild(row);
                    item.appendChild(sublist);
                    list.appendChild(item);
                });
            } catch (e) {
                console.error("Error loading projects", e);
            }
        }

        function toggleProject(name) {
            if (openProjects.has(name)) {
                openProjects.delete(name);
            } else {
                openProjects.add(name);
            }
            loadProjects();
        }

        async function switchConversation(id, title, projName) {
            try {
                await fetch(API_BASE + '/api/switch_conversation?id=' + encodeURIComponent(id), { method: 'POST' });
                activeConvId = id;
                document.getElementById('headerProject').textContent = '📁 ' + projName;
                document.getElementById('headerTitle').textContent = title.length > 28 ? title.substring(0, 26) + '...' : title;
                toggleDrawer();
                lastMsgCount = 0;
                fetchTranscript();
            } catch (e) {
                alert('Ошибка переключения: ' + e);
            }
        }

        async function fetchTranscript() {
            try {
                const res = await fetch(API_BASE + '/api/transcript');
                if (!res.ok) return;
                const data = await res.json();
                
                if (data.active_info) {
                    document.getElementById('headerProject').textContent = '📁 ' + data.active_info.project;
                    const t = data.active_info.title;
                    document.getElementById('headerTitle').textContent = t.length > 28 ? t.substring(0, 26) + '...' : t;
                }

                const msgs = data.messages || [];
                if (msgs.length !== lastMsgCount) {
                    renderMessages(msgs);
                    lastMsgCount = msgs.length;
                }
            } catch (e) {
                console.error("Fetch error", e);
            }
        }

        function renderMessages(msgs) {
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.role}`;
                div.innerHTML = `<div class="msg-role">${m.role === 'user' ? 'Вы' : 'Antigravity'}</div>${escapeHtml(m.text)}`;
                chat.appendChild(div);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function sendPrompt() {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';

            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `<div class="msg-role">Вы (Отправка...)</div>${escapeHtml(text)}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

            try {
                await fetch(API_BASE + '/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
            } catch (e) {
                alert('Ошибка отправки: ' + e);
            }
        }

        function quickSend(text) {
            document.getElementById('promptInput').value = text;
            sendPrompt();
        }

        async function sendAction(type) {
            try {
                await fetch(API_BASE + '/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: type })
                });
            } catch (e) {
                alert('Ошибка действия: ' + e);
            }
        }

        function toggleVoice() {
            const btn = document.getElementById('micBtn');
            const input = document.getElementById('promptInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Нажмите на значок микрофона на клавиатуре вашего телефона для надиктовки.');
                return;
            }

            if (isRecording) {
                if (recognition) recognition.stop();
                isRecording = false;
                btn.classList.remove('recording');
                return;
            }

            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;

            recognition.onstart = function() {
                isRecording = true;
                btn.classList.add('recording');
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                input.value += (input.value ? ' ' : '') + speechResult;
                autoGrow(input);
            };

            recognition.onerror = function() {
                isRecording = false;
                btn.classList.remove('recording');
            };

            recognition.onend = function() {
                isRecording = false;
                btn.classList.remove('recording');
            };

            recognition.start();
        }

        setInterval(fetchTranscript, 1500);
        fetchTranscript();
    </script>
</body>
</html>
